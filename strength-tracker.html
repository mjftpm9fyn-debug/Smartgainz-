    return;
  }

  const unit = state.unit;

  if(isEdit){
    const ex = day.exercises.find(e=>e.id===activeModal.exId);
    if(ex){
      ex.name = name;
      ex.muscleGroup = muscleGroup;
      ex.repMin = min;
      ex.repMax = max;
      ex.rir = rir;
      ex.targetSets = targetSets;
      ex.rest = rest;
      ex.dropSet = dropSet;
      ex.cardio = false;
      delete ex.duration;
      if(!ex.increment) ex.increment = {};
      ex.increment[unit] = inc;
      if(unit === 'kg' && ex.increment.lb === undefined) ex.increment.lb = round(inc * 2);
      if(unit === 'lb' && ex.increment.kg === undefined) ex.increment.kg = round(inc / 2);
    }
  } else {
    const id = activeDay + '_' + name.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,24) + '_' + Date.now().toString(36).slice(-4);
    const increment = {kg: unit==='kg'?inc:round(inc/2), lb: unit==='lb'?inc:round(inc*2)};
    day.exercises.push({id, name, muscleGroup, repMin:min, repMax:max, rir, targetSets, rest, dropSet, increment});
  }

  activeModal = null;
  saveData();
  render();
}

function sessionToRows(s){
  const unit = s.unit || state.unit;
  const rows = [];
  s.exercises.forEach(e=>{
    if(e.cardio){
      (e.sets || []).forEach((st,i)=>{
        rows.push([s.date, s.dayName, e.name, 'Cardio', i+1, st.duration, 'min', '', '']);
      });
      return;
    }
    (e.warmup || []).forEach((st,i)=>{
      rows.push([s.date, s.dayName, e.name, 'Warm-up', i+1, st.weight, unit, st.reps, '']);
    });
    (e.sets || []).forEach((st,i)=>{
      rows.push([s.date, s.dayName, e.name, 'Working', i+1, st.weight, unit, st.reps, e.pr ? 'Yes' : '']);
    });
    if(e.dropset){
      rows.push([s.date, s.dayName, e.name, 'Drop set', 'D', e.dropset.weight, unit, e.dropset.reps, '']);
    }
  });
  return rows;
}

function rowsToCSV(rows){
  const header = ['Date','Day','Exercise','Type','Set','Weight','Unit','Reps','PR'];
  return [header, ...rows].map(r=>r.map(v=>{
    const str = String(v);
    return /[",\n]/.test(str) ? `"${str.replace(/"/g,'""')}"` : str;
  }).join(',')).join('\n');
}

function downloadCSV(csv, filename){
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function exportHistory(){
  const sessions = (state.sessions || []).slice().sort((a,b)=>a.timestamp - b.timestamp);
  if(!sessions.length){
    showToast('No history to export yet');
    return;
  }
  const rows = sessions.flatMap(sessionToRows);
  downloadCSV(rowsToCSV(rows), 'smartgainz-history-' + new Date().toISOString().slice(0,10) + '.csv');
  showToast('History exported');
}

function exportSession(ts){
  const s = (state.sessions || []).find(sess=>sess.timestamp === ts);
  if(!s) return;
  const rows = sessionToRows(s);
  const safeDayName = s.dayName.toLowerCase().replace(/[^a-z0-9]+/g,'-');
  downloadCSV(rowsToCSV(rows), `smartgainz-${s.date}-${safeDayName}.csv`);
  showToast('Workout exported');
}
function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'smartgainz-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  showToast('Backup downloaded');
}

function importData(file){
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.days || !parsed.logs){
        showToast("That file doesn't look like a backup");
        return;
      }
      state = parsed;
      if(!state.sessions) state.sessions = [];
      if(!state.profile) state.profile = JSON.parse(JSON.stringify(DEFAULT_DATA.profile));
      if(!state.goal) state.goal = JSON.parse(JSON.stringify(DEFAULT_DATA.goal));
      if(!state.checkins) state.checkins = [];
      if(!state.measurements) state.measurements = [];
      if(!state.workoutGoal) state.workoutGoal = JSON.parse(JSON.stringify(DEFAULT_DATA.workoutGoal));
      if(!state.featuredLifts) state.featuredLifts = [null, null, null];
      if(state.profile.name === undefined) state.profile.name = null;
      saveData();
      render();
      showToast('Backup restored');
    }catch(err){
      showToast('Could not read that file');
    }
  };
  reader.readAsText(file);
}

function hasOutstandingSets(day){
  let outstanding = false;
  const effectiveExercises = day.exercises.map(getEffectiveExercise);
  effectiveExercises.forEach(ex=>{
    if(ex.cardio) return;
    const rows = document.querySelectorAll(`#sets-${ex.id} .set-row`);
    let completed = 0, partial = 0;
    const total = rows.length;
    rows.forEach(row=>{
      const w = parseFloat(row.querySelector('.w-input').value);
      const r = parseInt(row.querySelector('.r-input').value);
      const wValid = !isNaN(w) && w>0;
      const rValid = !isNaN(r) && r>0;
      if(wValid && rValid) completed++;
      else if(wValid || rValid) partial++;
    });
    if(partial > 0) outstanding = true;
    if(completed > 0 && completed < total) outstanding = true;

    const dropRow = document.querySelector(`.drop-row[data-ex="${ex.id}"]`);
    if(dropRow){
      const dw = parseFloat(dropRow.querySelector('.w-input').value);
      const dr = parseInt(dropRow.querySelector('.r-input').value);
      const dwValid = !isNaN(dw) && dw>0;
      const drValid = !isNaN(dr) && dr>0;
      if((dwValid || drValid) && !(dwValid && drValid)) outstanding = true;
    }
  });
  return outstanding;
}

function saveWorkout(){
  const day = state.days.find(d=>d.id===activeDay);
  saveDraftFromDOM();

  if(hasOutstandingSets(day)){
    activeModal = {
      type:'confirm-action',
      title:'Outstanding sets',
      message:'There are outstanding sets \u2014 are you sure you want to save and finish?',
      confirmLabel:'Finish anyway',
      onConfirm: proceedWithSaveWorkout
    };
    render();
    return;
  }

  proceedWithSaveWorkout();
}

function proceedWithSaveWorkout(){
  const day = state.days.find(d=>d.id===activeDay);
  const hasOrderChange = sessionExerciseOrder && JSON.stringify(sessionExerciseOrder) !== JSON.stringify(day.exercises.map(e=>e.id));
  if(Object.keys(sessionOverrides).length > 0 || hasOrderChange){
    activeModal = {type:'template-confirm'};
    render();
    return;
  }

  commitSaveWorkout();
}

function buildEffectiveTemplateExercises(day){
  // Returns a new exercises array with sessionOverrides + sessionExerciseOrder applied,
  // WITHOUT mutating the original day object.
  let exercises = day.exercises.map(ex=>{
    const override = sessionOverrides[ex.id];
    if(!override) return {...ex};
    if(override.replacement) return {...override.replacement};
    const updated = {...ex};
    if(override.warmup !== undefined && override.warmup !== null) updated.warmup = override.warmup;
    if(override.rest !== undefined && override.rest !== null) updated.rest = override.rest;
    if(override.targetSets !== undefined && override.targetSets !== null) updated.targetSets = override.targetSets;
    if(override.dropSet !== undefined && override.dropSet !== null) updated.dropSet = override.dropSet;
    return updated;
  });
  if(sessionExerciseOrder){
    const byId = {};
    exercises.forEach(ex=>{ byId[ex.id] = ex; });
    const reordered = sessionExerciseOrder.map(id=>byId[id]).filter(Boolean);
    if(reordered.length === exercises.length) exercises = reordered;
  }
  return exercises;
}

function resolveTemplateUpdate(applyPermanently){
  const day = state.days.find(d=>d.id===activeDay);
  if(applyPermanently && day){
    day.exercises = buildEffectiveTemplateExercises(day);
  }
  activeModal = null;
  commitSaveWorkout();
}

function saveAsNewTemplate(name){
  const day = state.days.find(d=>d.id===activeDay);
  if(!day) { activeModal = null; commitSaveWorkout(); return; }
  const effective = buildEffectiveTemplateExercises(day);
  const stamp = Date.now().toString(36).slice(-5);
  const newDayId = day.id + '_amended_' + stamp;
  const newExercises = effective.map((ex, i)=>({
    ...ex,
    id: newDayId + '_ex' + i + '_' + stamp
  }));
  const finalName = (name && name.trim()) ? name.trim() : (day.name + ' (amended)');
  state.days.push({id: newDayId, name: finalName, exercises: newExercises});
  activeModal = null;
  commitSaveWorkout();
  showToast(`Saved as "${finalName}"`);
}

function commitSaveWorkout(){
  const day = state.days.find(d=>d.id===activeDay);
  const effectiveExercises = getOrderedDayExercises(day).map(getEffectiveExercise);
  const today = new Date().toISOString().slice(0,10);
  const sessionTimestamp = Date.now();
  let savedAny = false;
  const prNames = [];
  const sessionExercises = [];
  const featuredEvents = [];

  effectiveExercises.forEach(ex=>{
    if(ex.cardio){
      const rows = document.querySelectorAll(`#sets-${ex.id} .set-row`);
      const sets = [];
      rows.forEach(row=>{
        const d = parseFloat(row.querySelector('.w-input').value);
        if(!isNaN(d) && d>0) sets.push({duration:d});
      });
      if(sets.length){
        if(!state.logs[ex.id]) state.logs[ex.id] = [];
        state.logs[ex.id].push({date:today, warmup:[], sets, dropset:null, pr:false, sessionId:sessionTimestamp});
        sessionExercises.push({id: ex.id, name: ex.name, muscleGroup: ex.muscleGroup || null, cardio:true, warmup:[], sets, dropset:null, pr:false});
        savedAny = true;
      }
      return;
    }

    const prevBest = bestWeight(ex.id);
    const rows = document.querySelectorAll(`#sets-${ex.id} .set-row:not(.drop-row)`);
    const sets = [];
    rows.forEach(row=>{
      const w = parseFloat(row.querySelector('.w-input').value);
      const r = parseInt(row.querySelector('.r-input').value);
      if(!isNaN(w) && !isNaN(r) && w>0 && r>0){
        sets.push({weight:w, reps:r, failure: row.classList.contains('failure-row') || undefined});
      }
    });

    let dropset = null;
    const dropRow = document.querySelector(`.drop-row[data-ex="${ex.id}"]`);
    if(dropRow){
      const dw = parseFloat(dropRow.querySelector('.w-input').value);
      const dr = parseInt(dropRow.querySelector('.r-input').value);
      if(!isNaN(dw) && !isNaN(dr) && dw>0 && dr>0){
        dropset = {weight:dw, reps:dr};
      }
    }

    const warmupRows = document.querySelectorAll(`.warmup-row[data-ex="${ex.id}"]`);
    const warmup = [];
    warmupRows.forEach(row=>{
      const w = parseFloat(row.querySelector('.w-input').value);
      const r = parseInt(row.querySelector('.r-input').value);
      if(!isNaN(w) && !isNaN(r) && w>0 && r>0){
        warmup.push({weight:w, reps:r});
      }
    });

    if(sets.length){
      const topWeight = Math.max(...sets.map(s=>s.weight));
      const isPR = prevBest !== null && topWeight > prevBest;
      if(!state.logs[ex.id]) state.logs[ex.id] = [];
      state.logs[ex.id].push({date:today, warmup, sets, dropset, pr:isPR, sessionId:sessionTimestamp});
      if(isPR) prNames.push(ex.name);
      sessionExercises.push({id: ex.id, name: ex.name, muscleGroup: ex.muscleGroup || null, cardio:false, warmup, sets, dropset, pr:isPR});
      savedAny = true;

      (state.featuredLifts||[]).forEach(f=>{
        if(!f || normalizeExerciseName(f.name) !== normalizeExerciseName(ex.name)) return;
        const hitGoal = !!(f.target && topWeight >= f.target && !f.goalHit);
        if(isPR || hitGoal){
          const topSet = sets.find(s=>s.weight===topWeight) || sets[0];
          featuredEvents.push({name: ex.name, weight: topWeight, reps: topSet.reps, isPR, isGoal: hitGoal, target: f.target});
        }
        if(hitGoal) f.goalHit = true;
      });
    }
  });

  if(savedAny){
    const countBefore = sessionsThisWeek();
    const durationSeconds = workoutStartTime ? Math.max(0, Math.floor((Date.now()-workoutStartTime)/1000)) : null;
    if(!state.sessions) state.sessions = [];
    state.sessions.push({
      date: today,
      timestamp: sessionTimestamp,
      dayId: activeDay,
      dayName: day.name,
      unit: state.unit,
      duration: durationSeconds,
      exercises: sessionExercises
    });
    saveData();
    clearDraftForDay(activeDay);
    dismissTimer();
    stopWorkoutTimer();
    sessionOverrides = {};
    sessionExerciseOrder = null;
    const target = (state.workoutGoal && state.workoutGoal.perWeek) || 4;
    const countAfter = sessionsThisWeek();
    const justHitTarget = countBefore < target && countAfter >= target;
    if(featuredEvents.length){
      featuredPopup = featuredEvents;
    } else if(prNames.length){
      showToast(`\ud83c\udfc6 New PR: ${prNames.join(', ')}`, 2800);
    } else if(justHitTarget){
      goalPopup = target;
    } else {
      showToast('Workout saved \u2014 nice work');
    }
    workoutInProgressDay = null;
    screen = 'templates';
    render();
  } else {
    activeModal = null;
    render();
    showToast('Enter at least one set first');
  }
}

function showToast(msg, duration=1800){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), duration);
}

let timer = {interval:null, endTime:null, remaining:0, label:'', done:false};
let workoutStartTime = null;
let workoutStopwatchInterval = null;
const WORKOUT_TIMER_KEY = 'smartgainz-workout-start';

function ensureNotificationPermission(){
  try{
    if('Notification' in window && Notification.permission === 'default'){
      Notification.requestPermission();
    }
  }catch(e){}
}

function fireNotificationIfPermitted(title, body){
  try{
    if('Notification' in window && Notification.permission === 'granted'){
      new Notification(title, {body});
    }
  }catch(e){}
}

function persistTimerState(){
  if(timer.interval && timer.endTime){
    storage.set(TIMER_KEY, JSON.stringify({endTime: timer.endTime, label: timer.label}));
  } else {
    storage.set(TIMER_KEY, '');
  }
}

function runTimerInterval(){
  clearInterval(timer.interval);
  timer.interval = setInterval(()=>{
    const remaining = Math.ceil((timer.endTime - Date.now()) / 1000);
    if(remaining <= 0){
      timer.remaining = 0;
      clearInterval(timer.interval);
      timer.interval = null;
      timer.done = true;
      playBeep();
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      fireNotificationIfPermitted('Rest done', `Back to it \u2014 ${timer.label}`);
      storage.set(TIMER_KEY, '');
    } else {
      timer.remaining = remaining;
    }
    renderTimerBar();
  }, 1000);
}

function startTimer(seconds, label){
  ensureNotificationPermission();
  timer.endTime = Date.now() + seconds*1000;
  timer.remaining = seconds;
  timer.label = label;
  timer.done = false;
  persistTimerState();
  runTimerInterval();
  renderTimerBar();
}

async function resumeTimerIfAny(){
  try{
    const res = await storage.get(TIMER_KEY);
    if(!res || !res.value) return;
    const data = JSON.parse(res.value);
    if(!data || !data.endTime) return;
    const now = Date.now();
    const remaining = Math.ceil((data.endTime - now) / 1000);
    timer.label = data.label;
    timer.endTime = data.endTime;
    if(remaining > 0){
      timer.remaining = remaining;
      timer.done = false;
      runTimerInterval();
      renderTimerBar();
    } else {
      const overdueMs = now - data.endTime;
      timer.remaining = 0;
      timer.done = true;
      renderTimerBar();
      if(overdueMs < 3*60*1000){
        playBeep();
        if(navigator.vibrate) navigator.vibrate([200,100,200]);
        fireNotificationIfPermitted('Rest done', `Back to it \u2014 ${timer.label}`);
      }
      storage.set(TIMER_KEY, '');
    }
  }catch(e){}
}

function dismissTimer(){
  clearInterval(timer.interval);
  timer.interval = null;
  timer.endTime = null;
  timer.remaining = 0;
  timer.done = false;
  storage.set(TIMER_KEY, '');
  renderTimerBar();
}

function renderTimerBar(){
  const bar = document.getElementById('timer-bar');
  const active = timer.interval || timer.done;
  document.body.classList.toggle('timer-active', !!active);
  if(!active){
    bar.classList.remove('active', 'done');
    bar.innerHTML = '';
    return;
  }
  const stack = document.querySelector('.bottom-fixed');
  const stackHeight = stack ? stack.offsetHeight : 56;
  bar.style.bottom = (stackHeight + 12) + 'px';
  bar.classList.add('active');
  bar.classList.toggle('done', timer.done);
  const mm = String(Math.floor(timer.remaining/60)).padStart(2,'0');
  const ss = String(timer.remaining%60).padStart(2,'0');
  bar.innerHTML = `
    <div>
      <div class="timer-label">${timer.done ? 'Rest done \u2014 back to it' : 'Resting \u00b7 ' + timer.label}</div>
      <div class="timer-time">${mm}:${ss}</div>
    </div>
    <div class="timer-actions">
      ${timer.done ? '' : '<button data-t="add30">+30s</button>'}
      <button data-t="dismiss">${timer.done ? 'Dismiss' : 'Skip'}</button>
    </div>
  `;
  bar.querySelector('[data-t="dismiss"]').onclick = dismissTimer;
  const addBtn = bar.querySelector('[data-t="add30"]');
  if(addBtn) addBtn.onclick = ()=>{ timer.endTime += 30000; timer.remaining += 30; persistTimerState(); renderTimerBar(); };
}

function startWorkoutTimer(){
  workoutStartTime = Date.now();
  storage.set(WORKOUT_TIMER_KEY, JSON.stringify({start: workoutStartTime, dayId: activeDay}));
  runWorkoutStopwatch();
}

function stopWorkoutTimer(){
  clearInterval(workoutStopwatchInterval);
  workoutStopwatchInterval = null;
  workoutStartTime = null;
  storage.set(WORKOUT_TIMER_KEY, '');
}

function runWorkoutStopwatch(){
  clearInterval(workoutStopwatchInterval);
  workoutStopwatchInterval = setInterval(renderWorkoutStopwatch, 1000);
  renderWorkoutStopwatch();
}

function renderWorkoutStopwatch(){
  const el = document.getElementById('workout-stopwatch');
  if(!el || !workoutStartTime) return;
  const elapsedSec = Math.max(0, Math.floor((Date.now() - workoutStartTime) / 1000));
  const mm = String(Math.floor(elapsedSec/60)).padStart(2,'0');
  const ss = String(elapsedSec%60).padStart(2,'0');
  el.textContent = `${mm}:${ss}`;
}

async function resumeWorkoutTimerIfAny(isColdStart){
  try{
    const res = await storage.get(WORKOUT_TIMER_KEY);
    if(!res || !res.value) return;
    const data = JSON.parse(res.value);
    if(!data || !data.start) return;
    workoutStartTime = data.start;
    if(data.dayId && state && state.days.some(d=>d.id===data.dayId)){
      workoutInProgressDay = data.dayId;
      if(isColdStart && screen !== 'day'){
        activeDay = data.dayId;
        screen = 'day';
        render();
      }
    }
    runWorkoutStopwatch();
  }catch(e){}
}

function resumeAllTimers(){
  resumeTimerIfAny();
  resumeWorkoutTimerIfAny(false);
}

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible') resumeAllTimers();
});
window.addEventListener('focus', resumeAllTimers);
window.addEventListener('pageshow', resumeAllTimers);

function playBeep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.25].forEach(delay=>{
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine';
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.2, ctx.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.2);
      o.start(ctx.currentTime + delay);
      o.stop(ctx.currentTime + delay + 0.22);
    });
  }catch(e){}
}

(async function init(){
  const storedBrand = await storage.get('smartgainz-brand');
  const storedLoggedIn = await storage.get('smartgainz-loggedin');
  const isLoggedIn = !!(storedLoggedIn && storedLoggedIn.value === 'true' && storedBrand && storedBrand.value);
  if(isLoggedIn){
    brand = storedBrand.value;
    applyBrandTheme(brand);
    screen = 'templates';
  } else {
    screen = 'brand-select';
  }
  await loadDraft();
  await loadData();
  if(isLoggedIn){
    loadBrandTemplates();
    render();
    resumeTimerIfAny();
    resumeWorkoutTimerIfAny(true);
  }
})();
