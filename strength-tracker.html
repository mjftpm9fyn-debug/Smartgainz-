<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmartGainz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121316;
    --surface:#1B1C22;
    --surface-2:#24252D;
    --text:#EDEEF2;
    --text-muted:#9294A3;
    --accent:#3E6FBF;
    --accent-soft:#233A5C;
    --good:#6FA05C;
    --gold:#D9A441;
    --border:rgba(237,238,242,0.10);
  }
  *{box-sizing:border-box;}
  input,select,textarea{font-size:16px;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:480px;margin:0 auto;padding:16px 14px 150px;}
  body.timer-active .app{padding-bottom:220px;}

  .screen-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:0.5px;margin:6px 0 14px;}
  .day-back{font-size:13px;color:var(--text-muted);cursor:pointer;margin-bottom:10px;display:inline-block;}
  .workout-stopwatch-badge{
    background:var(--surface-2);border:1px solid var(--border);border-radius:20px;
    padding:6px 12px;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:0.5px;color:var(--accent);
    white-space:nowrap;
  }
  .screen-title-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}

  .template-card{cursor:pointer;}
  .template-name{font-size:17px;font-weight:700;margin-bottom:4px;}
  .template-exercises{
    font-size:12.5px;color:var(--text-muted);line-height:1.5;margin-bottom:8px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .template-last{font-size:11.5px;color:var(--gold);font-weight:600;}
  .template-head{display:flex;justify-content:space-between;align-items:flex-start;}
  .template-edit{color:var(--text-muted);font-size:12px;cursor:pointer;padding:2px 4px;}
  .add-template-card{
    border:1px dashed var(--border);display:flex;align-items:center;justify-content:center;
    padding:16px;color:var(--text-muted);font-size:14px;font-weight:600;cursor:pointer;
  }

  .icon-row{display:flex;gap:10px;margin:-6px 0 14px;flex-wrap:wrap;}
  .icon-btn{background:transparent;border:1px solid var(--border);color:var(--text-muted);
    font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:8px;cursor:pointer;}
  .icon-btn.active{color:var(--accent);border-color:var(--accent);}

  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px;}
  .cal-dow{font-size:10.5px;color:var(--text-muted);text-align:center;}
  .cal-cell{
    position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    border-radius:8px;font-size:12.5px;color:var(--text-muted);cursor:pointer;
  }
  .cal-cell.empty{cursor:default;}
  .cal-cell.done{background:var(--surface-2);color:var(--text);font-weight:700;}
  .cal-cell.selected{outline:2px solid var(--accent);}
  .cal-dot{position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--good);}
  .cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .cal-nav button{background:transparent;border:none;color:var(--text-muted);font-size:16px;cursor:pointer;padding:4px 10px;}
  .cal-month{font-size:14px;font-weight:600;}

  .vol-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .vol-name{width:82px;font-size:12.5px;color:var(--text-muted);flex-shrink:0;}
  .vol-bar-track{flex:1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
  .vol-bar-fill{height:100%;background:var(--good);}
  .vol-bar-fill.over{background:var(--gold);}
  .vol-count{width:52px;text-align:right;font-size:11.5px;color:var(--text-muted);flex-shrink:0;}

  .profile-card{margin-bottom:12px;}
  .profile-card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;font-weight:600;}
  .field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}
  .field{display:flex;flex-direction:column;gap:3px;}
  .field label{font-size:11px;color:var(--text-muted);}
  .field input,.field select{
    background:var(--surface-2);border:1px solid var(--border);border-radius:7px;
    color:var(--text);font-family:'Work Sans';font-size:16px;padding:8px;
  }
  .nutrition-card{background:var(--accent-soft);border-radius:12px;padding:1rem 1.1rem;margin-bottom:12px;}
  .nutrition-card .profile-card-head{color:var(--text);}
  .nutrition-numbers{font-size:13.5px;line-height:1.7;margin-bottom:8px;}
  .adjust-banner{font-size:12.5px;background:rgba(237,234,224,0.12);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .adjust-banner button{background:var(--accent);color:#12131A;border:none;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;}

  .progress-row{display:flex;align-items:center;gap:10px;}
  .progress-track{flex:1;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--good);}
  .stepper{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .stepper button{width:32px;height:32px;border-radius:8px;background:var(--surface-2);border:1px solid var(--border);color:var(--text);font-size:16px;cursor:pointer;}
  .stepper .val{font-family:'Bebas Neue',sans-serif;font-size:22px;min-width:24px;text-align:center;}

  .featured-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px;}
  .featured-card{
    position:relative;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;
    padding:10px 8px;cursor:pointer;min-height:76px;
  }
  .featured-card.add-lift{
    display:flex;align-items:center;justify-content:center;text-align:center;
    border-style:dashed;color:var(--text-muted);font-size:12px;font-weight:600;cursor:pointer;
  }
  .featured-name{font-size:11.5px;color:var(--text-muted);margin-bottom:4px;line-height:1.3;}
  .featured-best{font-size:15px;font-weight:700;}
  .featured-target{font-size:10.5px;color:var(--gold);margin-top:4px;}
  .featured-remove{
    position:absolute;top:4px;right:4px;background:transparent;border:none;
    color:var(--text-muted);font-size:11px;cursor:pointer;padding:2px;
  }

  .overlay-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:70;}
  .overlay-panel{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:calc(100% - 40px);max-width:420px;background:var(--surface);
    border:1px solid var(--border);border-radius:16px;padding:18px;z-index:71;
    max-height:80vh;overflow-y:auto;
  }
  .hist-list{margin-top:10px;border-top:1px solid var(--border);padding-top:8px;}
  .hist-list .hist-row{align-items:center;}
  .hist-del{background:transparent;border:none;color:var(--text-muted);font-size:13px;cursor:pointer;padding:2px 4px;}
  .overlay-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .overlay-title{font-size:16px;font-weight:700;}
  .overlay-close{background:transparent;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;}
  .metric-toggle{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;margin-bottom:14px;width:fit-content;}
  .metric-toggle button{background:transparent;border:none;color:var(--text-muted);font-size:12px;font-weight:600;padding:7px 14px;cursor:pointer;}
  .metric-toggle button.active{background:var(--accent);color:#12131A;}

  .bottom-fixed{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    display:flex;flex-direction:column;background:var(--surface);border-top:1px solid var(--border);
  }
  .action-bar{display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);}
  .action-bar .save-btn{flex:1;margin:0;}
  .cancel-btn{
    flex:0 0 92px;background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border);
    border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;
  }
  .bottom-nav{display:flex;}
  .nav-btn{
    flex:1;background:transparent;border:none;color:var(--text-muted);
    font-family:'Work Sans';font-size:13px;font-weight:600;padding:16px 8px;cursor:pointer;
  }
  .nav-btn.active{color:var(--accent);}

  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;padding-top:4px;}
  .wordmark{font-family:'Bebas Neue',sans-serif;font-size:29px;letter-spacing:0.5px;line-height:1;color:var(--text);white-space:nowrap;}
  .wordmark span{color:var(--accent);}

  .gate-screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;background:var(--bg);}
  .gate-title{font-family:'Bebas Neue',sans-serif;font-size:32px;color:var(--text);margin-bottom:28px;letter-spacing:0.5px;text-align:center;max-width:320px;}
  .brand-option{
    width:100%;max-width:320px;background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:22px;margin-bottom:14px;text-align:center;cursor:pointer;
  }
  .brand-option .brand-name{font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--text);}
  .brand-option .brand-name span{color:var(--accent);}
  .login-box{width:100%;max-width:320px;}
  .login-box input{
    width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;
    color:var(--text);font-family:'Work Sans';font-size:16px;padding:11px 12px;margin-bottom:10px;
  }
  .login-box .save-btn{width:100%;margin-top:4px;}
  .login-error{color:#E05A5A;font-size:13px;margin-bottom:10px;text-align:center;}
  .gate-back{color:var(--text-muted);font-size:13px;margin-top:18px;cursor:pointer;}
  .unit-toggle{display:flex;border:1px solid var(--border);border-radius:7px;overflow:hidden;}
  .unit-toggle button{
    background:transparent;border:none;color:var(--text-muted);
    font-family:'Work Sans';font-size:12px;font-weight:600;padding:7px 11px;cursor:pointer;
  }
  .unit-toggle button.active{background:var(--accent);color:#12131A;}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;padding:8px 14px;border-radius:20px;border:1px solid var(--border);
    color:var(--text-muted);font-size:13px;font-weight:600;background:var(--surface);cursor:pointer;white-space:nowrap;
  }
  .tab.active{background:var(--accent);color:#12131A;border-color:var(--accent);}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:14px 14px 12px;margin-bottom:12px;
  }
  .ex-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px;}
  .ex-name{font-size:16px;font-weight:600;}
  .ex-range{font-size:11px;color:var(--text-muted);white-space:nowrap;margin-left:8px;padding-top:2px;}

  .badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
  .badge{
    font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:20px;
    background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border);
  }
  .badge.drop{color:#E0916E;border-color:rgba(224,145,110,0.3);}
  .badge.super{color:var(--good);border-color:rgba(143,160,92,0.3);}
  .badge.pr{color:var(--gold);border-color:rgba(217,164,65,0.35);}

  .menu-dots{background:transparent;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;padding:0 4px;line-height:1;}
  .exercise-menu{
    display:flex;flex-direction:column;background:var(--surface-2);border:1px solid var(--border);
    border-radius:10px;margin:6px 0 10px;overflow:hidden;
  }
  .exercise-menu button{
    background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--text);
    font-family:'Work Sans';font-size:13.5px;font-weight:500;padding:11px 14px;text-align:left;cursor:pointer;
  }
  .exercise-menu button:last-child{border-bottom:none;}
  .exercise-menu button.menu-danger{color:#E0916E;}
  .ex-note{font-size:12px;color:var(--gold);font-style:italic;margin-bottom:6px;}

  .exercise-list{display:flex;flex-direction:column;}
  .exercise-card{touch-action:pan-y;}
  .exercise-card.dragging{
    z-index:90;box-shadow:0 12px 28px rgba(0,0,0,0.55);
    transform:scale(1.03);cursor:grabbing;opacity:0.96;margin:0;pointer-events:none;
  }
  .drag-placeholder{
    border:2px dashed var(--border);border-radius:12px;margin-bottom:12px;background:transparent;
  }
  .drag-handle{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);
    font-size:16px;cursor:grab;padding:4px 10px;border-radius:8px;touch-action:none;
  }
  .compact-reorder-card{padding:16px 14px;}  .compact-reorder-card .ex-name{font-size:18px;font-weight:700;color:var(--accent);}
  .compact-reorder-card .drag-handle{font-size:17px;padding:8px 14px;}

  .picker-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .picker-cancel{background:transparent;border:none;color:var(--accent);font-size:14px;font-weight:600;cursor:pointer;padding:0;}
  .picker-search{
    width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;
    color:var(--text);font-family:'Work Sans';font-size:16px;padding:10px 12px;margin-bottom:10px;
  }
  .picker-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none;}
  .picker-tabs::-webkit-scrollbar{display:none;}
  .picker-list{display:flex;flex-direction:column;gap:8px;padding-bottom:80px;}
  .picker-row{
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;cursor:pointer;
  }
  .picker-row:active{background:var(--surface-2);}
  .template-exercise-row{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:flex-start;
  }
  .te-done-bar{display:flex;justify-content:flex-end;margin-bottom:10px;}
  .te-done-btn{background:transparent;border:none;color:var(--accent);font-size:14px;font-weight:700;cursor:pointer;padding:0;}
  .reorder-done-bar{
    display:none;position:fixed;left:0;right:0;top:0;z-index:65;
    background:var(--accent);color:#12131A;text-align:center;padding:12px;
    font-size:13px;font-weight:700;cursor:pointer;
  }
  body.reorder-active .reorder-done-bar{display:block;}

  .backup-row{display:flex;gap:16px;flex-wrap:wrap;margin:-6px 0 16px;}
  .backup-row .link-btn{padding:0;}

  .session-card{cursor:pointer;}
  .session-head{display:flex;justify-content:space-between;align-items:center;}
  .session-date{font-size:15px;font-weight:600;}
  .session-day{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .session-caret{color:var(--text-muted);font-size:14px;}
  .session-body{margin-top:10px;border-top:1px solid var(--border);padding-top:10px;display:flex;flex-direction:column;gap:9px;}
  .hist-ex-name{font-size:13.5px;font-weight:600;margin-bottom:2px;}
  .hist-ex-sets{font-size:12.5px;color:var(--text-muted);}

  .last-line{font-size:12.5px;color:var(--text-muted);margin-bottom:6px;}
  .suggestion{
    font-size:13px;padding:7px 10px;border-radius:8px;margin-bottom:10px;font-weight:500;
  }
  .suggestion.up{background:rgba(143,160,92,0.15);color:var(--good);}
  .suggestion.hold{background:rgba(62,111,191,0.14);color:#8FB4E8;}
  .suggestion.start{background:var(--surface-2);color:var(--text-muted);}

  .sets{display:flex;flex-direction:column;gap:6px;margin-bottom:8px;}
  .set-row{display:flex;align-items:center;gap:6px;}
  .set-num{width:22px;font-size:15px;font-weight:700;color:var(--text-muted);text-align:center;}
  .set-num[data-action="set-num-tap"]{touch-action:manipulation;user-select:none;-webkit-user-select:none;cursor:pointer;}
  .set-row input{
    width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;
    color:var(--text);font-family:'Work Sans';font-size:16px;padding:8px 6px;text-align:center;
  }
  .set-row input::placeholder{color:var(--text-muted);opacity:0.6;}
  .set-row .x{color:var(--text-muted);font-size:12px;}
  .set-row .rm{background:transparent;border:none;color:var(--text-muted);font-size:19px;width:36px;height:36px;min-width:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .set-row .copy-btn{color:var(--accent);font-size:17px;}
  .drop-row input{border-color:rgba(224,145,110,0.4);}
  .drop-row .set-num{color:#E0916E;font-weight:700;}
  .failure-row input{border-color:rgba(224,90,90,0.4);}
  .failure-row .set-num{color:#E05A5A;font-weight:700;}

  .set-label{font-size:11px;color:var(--text-muted);margin:2px 0;}
  .warmup-sets{display:flex;flex-direction:column;gap:6px;margin-bottom:2px;}
  .warmup-row input{border-style:dashed;color:var(--text-muted);}
  .warmup-row .set-num{color:var(--gold);opacity:1;}

  .row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}
  .link-btn{
    background:transparent;border:none;color:var(--accent);font-size:12.5px;font-weight:600;
    padding:4px 0;cursor:pointer;
  }
  .link-btn.muted{color:var(--text-muted);}
  .rest-btn{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);
    font-size:12px;font-weight:600;padding:6px 10px;border-radius:7px;cursor:pointer;
  }

  .timer-bar{
    position:fixed;left:50%;bottom:70px;transform:translateX(-50%);
    width:calc(100% - 28px);max-width:452px;
    background:var(--surface-2);border:1px solid var(--border);border-radius:14px;
    padding:10px 14px;display:none;align-items:center;justify-content:space-between;
    box-shadow:0 8px 24px rgba(0,0,0,0.4);z-index:50;
  }
  .timer-bar.active{display:flex;}
  .timer-bar.done{background:var(--good);border-color:var(--good);}
  .timer-bar.done .timer-label,.timer-bar.done .timer-time{color:#12131A;}
  .timer-label{font-size:11px;color:var(--text-muted);margin-bottom:2px;}
  .timer-time{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:1px;line-height:1;}
  .timer-actions{display:flex;gap:6px;}
  .timer-actions button{
    background:var(--surface);border:1px solid var(--border);color:var(--text);
    font-size:12px;font-weight:600;padding:7px 11px;border-radius:8px;cursor:pointer;
  }

  .history-toggle{font-size:12px;color:var(--text-muted);cursor:pointer;margin-top:4px;user-select:none;}
  .history{display:none;margin-top:8px;border-top:1px solid var(--border);padding-top:8px;}
  .history.open{display:block;}
  .hist-row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);padding:3px 0;}
  .hist-row b{color:var(--text);font-weight:600;}
  .sparkline{margin-top:6px;}

  .save-btn{
    width:100%;background:var(--accent);color:#12131A;border:none;border-radius:10px;
    padding:14px;font-size:15px;font-weight:700;letter-spacing:0.3px;cursor:pointer;
  }
  .save-btn:active{opacity:0.85;}
  .toast{
    position:fixed;bottom:130px;left:50%;transform:translateX(-50%);
    background:var(--good);color:#12131A;padding:9px 16px;border-radius:20px;
    font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity 0.25s;
    max-width:calc(100% - 40px);text-align:center;
  }
  .toast.show{opacity:1;}

  .add-ex{
    display:flex;align-items:center;justify-content:center;gap:6px;
    border:1px dashed var(--border);border-radius:12px;padding:12px;color:var(--text-muted);
    font-size:13px;font-weight:600;cursor:pointer;margin-bottom:12px;
  }
  .add-form{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px;display:none;}
  .add-form.open{display:block;}
  label{font-size:11px;color:var(--text-muted);display:block;margin-bottom:3px;margin-top:8px;}
  input,select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);border-radius:7px;
    color:var(--text);font-family:'Work Sans';font-size:16px;padding:8px;
  }
  input[type="checkbox"]{width:auto;}
  .checkbox-row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--text-muted);}

const storage = {
  async get(key){
    try{
      const v = localStorage.getItem(key);
      return v !== null ? {key, value:v} : null;
    }catch(e){ return null; }
  },
  async set(key, value){
    try{
      localStorage.setItem(key, value);

    }catch(e){ return null; }
  }
};

async function loadData(){
  try{
    let res = await storage.get(STORAGE_KEY);
    if(!res){
      const legacy = await storage.get(LEGACY_STORAGE_KEY);
      if(legacy && legacy.value){
        await storage.set(STORAGE_KEY, legacy.value);
        res = legacy;
      }
    }
    state = res ? JSON.parse(res.value) : JSON.parse(JSON.stringify(DEFAULT_DATA));
  }catch(e){
    state = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  if(!state.sessions) state.sessions = [];
  if(!state.profile) state.profile = JSON.parse(JSON.stringify(DEFAULT_DATA.profile));
  if(!state.goal) state.goal = JSON.parse(JSON.stringify(DEFAULT_DATA.goal));
  if(!state.checkins) state.checkins = [];
  if(!state.measurements) state.measurements = [];
  if(!state.workoutGoal) state.workoutGoal = JSON.parse(JSON.stringify(DEFAULT_DATA.workoutGoal));
  if(!state.featuredLifts) state.featuredLifts = [null, null, null];
  if(state.profile.name === undefined) state.profile.name = null;
  const pushLatMig = state.days.find(d=>d.id==='push') && state.days.find(d=>d.id==='push').exercises.find(e=>e.id==='push_lateral');
  if(pushLatMig && pushLatMig.name === 'Lateral Raise') pushLatMig.name = 'Machine Lateral Raise';
  state.days.forEach(day=>{
    day.exercises.forEach(ex=>{
      if(!ex.muscleGroup && MUSCLE_MAP[ex.id]) ex.muscleGroup = MUSCLE_MAP[ex.id];
    });
  });
  if(state.featuredLifts){
    state.featuredLifts = state.featuredLifts.map(f=>{
      if(f && !f.name && f.exId){
        const found = findExerciseById(f.exId);
        if(found) return {name: found.name, target: f.target || null};
        return null;
      }
      return f;
    });
  }
  render();
}

function loadBrandTemplates(){
  const brandDataExistedBefore = !!state.brandData;
  if(!state.brandData) state.brandData = {};
  // One-time migration from the old templates-only per-brand system.
  if(state.templatesByBrand){
    Object.keys(state.templatesByBrand).forEach(b=>{
      state.brandData[b] = state.brandData[b] || {};
      if(state.brandData[b].days === undefined) state.brandData[b].days = state.templatesByBrand[b];
    });
    delete state.templatesByBrand;
  }
  // SmartGainz is the original real account. Only on the very first time this
  // whole per-brand system is ever set up (brandData didn't exist at all before
  // this call) can we safely assume the shared top-level fields belong to it —
  // because brand switching couldn't have happened yet to put someone else's
  // data in those fields. On every later call, even for smartgainz, a missing
  // bucket just means it hasn't been visited yet and should start fresh, exactly
  // like any other brand — never inherit whatever brand happened to be active
  // most recently.
  if(!brandDataExistedBefore && brand === 'smartgainz'){
    const b = state.brandData.smartgainz = state.brandData.smartgainz || {};
    if(b.days === undefined) b.days = state.days;
    b.logs = state.logs;
    b.sessions = state.sessions;
    b.profile = state.profile;
    b.goal = state.goal;
    b.checkins = state.checkins;
    b.measurements = state.measurements;
    b.workoutGoal = state.workoutGoal;
    b.featuredLifts = state.featuredLifts;
    b.unit = state.unit;
  }

  if(!state.brandData[brand]) state.brandData[brand] = {};
  const bucket = state.brandData[brand];
  if(bucket.days === undefined) bucket.days = [];
  if(bucket.logs === undefined) bucket.logs = {};
  if(bucket.sessions === undefined) bucket.sessions = [];
  if(bucket.profile === undefined) bucket.profile = JSON.parse(JSON.stringify(DEFAULT_DATA.profile));
  if(bucket.goal === undefined) bucket.goal = JSON.parse(JSON.stringify(DEFAULT_DATA.goal));
  if(bucket.checkins === undefined) bucket.checkins = [];
  if(bucket.measurements === undefined) bucket.measurements = [];
  if(bucket.workoutGoal === undefined) bucket.workoutGoal = JSON.parse(JSON.stringify(DEFAULT_DATA.workoutGoal));
  if(bucket.featuredLifts === undefined) bucket.featuredLifts = [null, null, null];
  if(bucket.unit === undefined) bucket.unit = 'kg';

  BRAND_DATA_FIELDS.forEach(f=>{ state[f] = bucket[f]; });
}

function saveDraftFromDOM(){
  const day = state.days.find(d=>d.id===activeDay);
  if(!day) return;
  const dayData = {};
  day.exercises.forEach(ex=>{
    const warmupRowsEls = document.querySelectorAll(`.warmup-row[data-ex="${ex.id}"]`);
    const warmup = Array.from(warmupRowsEls).map(row=>({
      w: row.querySelector('.w-input').value,
      r: row.querySelector('.r-input').value
    }));
    const setRowsEls = document.querySelectorAll(`#sets-${ex.id} .set-row`);
    const sets = Array.from(setRowsEls).map(row=>{
      const rInput = row.querySelector('.r-input');
      return {
        w: row.querySelector('.w-input').value,
        r: rInput ? rInput.value : '',
        failure: row.classList.contains('failure-row') || undefined
      };
    });
    const hasAny = warmup.some(s=>s.w || s.r) || sets.some(s=>s.w || s.r || s.failure);
    if(hasAny){
      dayData[ex.id] = {warmup, sets};
    }
  });
  draftState[activeDay] = dayData;
  storage.set(DRAFT_KEY, JSON.stringify(draftState));
}

function scheduleDraftSave(){
  clearTimeout(draftSaveTimeout);
  draftSaveTimeout = setTimeout(saveDraftFromDOM, 300);
}

function clearDraftForDay(dayId){

function convertSetType(exId, kind, idx, to){
  const day = state.days.find(d=>d.id===activeDay);
  const ex = day && day.exercises.find(e=>e.id===exId);
  if(!ex) return;
  const effectiveEx = getEffectiveExercise(ex);
  const currentTargetSets = effectiveEx.targetSets || defaultSetCount(effectiveEx);
  const currentWarmup = effectiveEx.warmup || 0;
  const restructuring = kind === 'set' && (to === 'warmup' || to === 'drop');

  if(restructuring && currentTargetSets <= 1){
    showToast('Keep at least one working set');
    activeModal = null;
    render();
    return;
  }

  let row;
  if(kind === 'set') row = document.querySelector(`#sets-${exId} .set-row[data-set="${idx}"]:not(.drop-row)`);
  else if(kind === 'warmup') row = document.querySelector(`.warmup-row[data-ex="${exId}"][data-warmup="${idx}"]`);
  else if(kind === 'drop') row = document.querySelector(`.drop-row[data-ex="${exId}"]`);
  const w = row ? row.querySelector('.w-input').value : '';
  const r = row ? row.querySelector('.r-input').value : '';

  saveDraftFromDOM();
  const dayDraft = draftState[activeDay] = draftState[activeDay] || {};
  const exDraft = dayDraft[exId] = dayDraft[exId] || {};
  exDraft.warmup = exDraft.warmup || [];
  exDraft.sets = exDraft.sets || [];

  sessionOverrides[exId] = sessionOverrides[exId] || {};

  if(kind === 'set' && to === 'failure'){
    exDraft.sets[idx] = {w, r, failure: true};
  } else if(kind === 'set' && to === 'set'){
    exDraft.sets[idx] = {w, r, failure: false};
  } else if(kind === 'set' && to === 'warmup'){
    exDraft.sets.splice(idx, 1);
    exDraft.warmup.push({w, r});
    sessionOverrides[exId].targetSets = currentTargetSets - 1;
    sessionOverrides[exId].warmup = currentWarmup + 1;
  } else if(kind === 'set' && to === 'drop'){
    exDraft.sets.splice(idx, 1);
    exDraft.sets[currentTargetSets - 1] = {w, r};
    sessionOverrides[exId].targetSets = currentTargetSets - 1;
    sessionOverrides[exId].dropSet = true;
  } else if(kind === 'warmup' && to === 'set'){
    exDraft.warmup.splice(idx, 1);
    exDraft.sets.splice(currentTargetSets, 0, {w, r});
    sessionOverrides[exId].warmup = Math.max(0, currentWarmup - 1);
    sessionOverrides[exId].targetSets = currentTargetSets + 1;
  } else if(kind === 'drop' && to === 'set'){
    exDraft.sets.splice(currentTargetSets, 1);
    exDraft.sets.splice(currentTargetSets, 0, {w, r});
    sessionOverrides[exId].dropSet = false;
    sessionOverrides[exId].targetSets = currentTargetSets + 1;
  }

  activeModal = null;
  render();
}

  Intermediate: {bg:'#1D4A42', text:'#5DCAA5'},
  Advanced:     {bg:'#4A3A0F', text:'#F0C94D'},
  Olympian:     {bg:'#3D1F5C', text:'#C99BFF'}
};
const TIERED_EXERCISES = {
  'Back Squat': {lift:'squat', factor:1},
  'Front Squat': {lift:'squat', factor:0.85},
  'Deadlift': {lift:'deadlift', factor:1},
  'Barbell Bench Press': {lift:'bench', factor:1},
  'Dumbbell Bench Press': {lift:'bench', factor:0.8},
  'Incline Barbell Press': {lift:'bench', factor:0.78},
  'Incline Dumbbell Press': {lift:'bench', factor:0.624},
  'Overhead Press (Barbell)': {lift:'ohp', factor:1},
  'Dumbbell Shoulder Press': {lift:'ohp', factor:0.8}
};

function getStrengthTier(exerciseName, weight, bodyweight, sex){
  const mapping = TIERED_EXERCISES[exerciseName];
  if(!mapping || !weight || !bodyweight) return null;
  const sexKey = sex === 'female' ? 'female' : 'male';
  const thresholds = STRENGTH_STANDARDS[sexKey][mapping.lift].map(t=>t*mapping.factor);
  const ratio = weight / bodyweight;
  let tierIdx = -1;
  thresholds.forEach((t,i)=>{ if(ratio >= t) tierIdx = i; });
  if(tierIdx === -1) return null;
  return {tier: STRENGTH_TIER_NAMES[tierIdx], ratio: round(ratio)};
}

function bestWeight(exId){
  const log = getLog(exId);
  if(!log.length) return null;
  let best = -Infinity;
  log.forEach(l=>l.sets.forEach(s=>{ if(s.weight > best) best = s.weight; }));
  return best === -Infinity ? null : best;
}

function estimate1RM(weight, reps){
  if(!weight || !reps) return 0;
  if(reps <= 1) return round(weight);
  return round(weight * (1 + reps/30));
}

function bestEstimated1RM(exId){
  const log = getLog(exId);
  if(!log.length) return null;
  let best = -Infinity;
  log.forEach(l=>l.sets.forEach(s=>{
    const e = estimate1RM(s.weight, s.reps);
    if(e > best) best = e;
  }));
  return best === -Infinity ? null : best;
}

const EXERCISE_NAME_ALIASES = {
  'rope triceps pushdown': 'triceps pushdown (rope)',
  'underhand-grip lat pulldown': 'underhand lat pulldown',
  'seated cable row (low)': 'seated cable row',
  'leg curl (seated)': 'seated leg curl',
  'lateral raise': 'lateral raise (dumbbell)',
  'cable hammer curl': 'hammer curl',
  'overhead cable triceps extension': 'overhead triceps extension',
  'machine bench press': 'machine chest press'
};

function normalizeExerciseName(name){
  if(!name) return '';
  let n = name.trim().toLowerCase()
    .replace(/\bdb\b/g, 'dumbbell')
    .replace(/\bbb\b/g, 'barbell')
    .replace(/\s+/g, ' ');
  if(EXERCISE_NAME_ALIASES[n]) n = EXERCISE_NAME_ALIASES[n];
  return n;
}

function getExerciseIdsByName(name){
  const norm = normalizeExerciseName(name);
  const ids = new Set();
  state.days.forEach(day=>{
    day.exercises.forEach(ex=>{ if(normalizeExerciseName(ex.name) === norm) ids.add(ex.id); });
  });
  (state.sessions||[]).forEach(s=>{
    s.exercises.forEach(e=>{ if(normalizeExerciseName(e.name) === norm) ids.add(e.id); });
  });
  return [...ids];
}

function getMergedLogByName(name){
  const ids = getExerciseIdsByName(name);
  let merged = [];
  ids.forEach(id=>{ merged = merged.concat(getLog(id)); });
  merged.sort((a,b)=> (a.sessionId||0) - (b.sessionId||0));
  return merged;
}

function bestWeightByName(name){
  const log = getMergedLogByName(name);
  if(!log.length) return null;
  let best = -Infinity;
  log.forEach(l=>l.sets.forEach(s=>{ if(s.weight !== undefined && s.weight > best) best = s.weight; }));
  return best === -Infinity ? null : best;
}

function bestEstimated1RMByName(name){
  const log = getMergedLogByName(name);
  if(!log.length) return null;
  let best = -Infinity;
  log.forEach(l=>l.sets.forEach(s=>{
    if(s.weight === undefined) return;
    const e = estimate1RM(s.weight, s.reps);
    if(e > best) best = e;
  }));
  return best === -Infinity ? null : best;
}

function getSuggestion(ex){
  if(ex.cardio){
    const log = getLog(ex.id);
    if(!log.length){
      return {text:`No history yet \u2014 aim for ${ex.duration||20} minutes.`, type:'start'};
    }
    const last = log[log.length-1];
    const totalMin = last.sets.reduce((sum,s)=>sum+(s.duration||0),0);
    return {text:`Last time: ${totalMin} min total \u2014 keep it consistent or push a little further.`, type:'hold'};
  }
  const log = getLog(ex.id);
  const unit = state.unit;
  const inc = ex.increment[unit] !== undefined ? ex.increment[unit] : ex.increment.kg;
  if(!log.length){
    return {text:`No history yet — pick a weight you can do for ${ex.repMin}\u2013${ex.repMax} reps at ${ex.rir || '1-2'} RIR.`, type:'start'};
  }
  const last = log[log.length-1];
  const prev = log.length >= 2 ? log[log.length-2] : null;
  const topWeight = Math.max(...last.sets.map(s=>s.weight));
  const lastAllMax = last.sets.every(s=>s.reps>=ex.repMax);
  const prevAllMax = prev ? prev.sets.every(s=>s.reps>=ex.repMax) : false;
  const anyBelowMin = last.sets.some(s=>s.reps<ex.repMin);

  if(lastAllMax && prevAllMax){
    return {text:`Two sessions in a row at the top of the range \u2014 go up to ${round(topWeight+inc)} ${unit}, reset to ${ex.repMin} reps.`, type:'up'};
  } else if(lastAllMax && !prevAllMax){
    return {text:`Hit ${ex.repMax}+ on every set \u2014 do it again next session to trigger a weight increase.`, type:'hold'};
  } else if(anyBelowMin){
    return {text:`Stay at ${topWeight} ${unit} \u2014 build back up to ${ex.repMin} reps across all sets.`, type:'hold'};
  } else {
    return {text:`Same weight, ${topWeight} ${unit} \u2014 push for +1 rep per set this time.`, type:'hold'};
  }
}

function warmupPlaceholders(ex){
  const log = getLog(ex.id);
  if(!log.length) return [];
  const top = Math.max(...log[log.length-1].sets.map(s=>s.weight));
  const pcts = [0.5, 0.7];
  return pcts.slice(0, ex.warmup || 0).map(p=>round(top*p));
}

function defaultSetCount(ex){
  return ex.targetSets || 3;
}

function lastDoneForDay(dayId){
  const sessions = (state.sessions || []).filter(s=>s.dayId===dayId);
  if(!sessions.length) return null;
  return sessions.reduce((a,b)=> a.timestamp>b.timestamp?a:b).date;
}

function relativeDays(dateStr){
  const then = new Date(dateStr + 'T00:00:00');
  const now = new Date();
  const diffDays = Math.floor((now - then) / (1000*60*60*24));
  if(diffDays<=0) return 'Today';
  if(diffDays===1) return '1 day ago';
  return `${diffDays} days ago`;
}

function currentWeekRange(){
  const now = new Date();
  const day = now.getDay();
  const diffToMonday = (day===0) ? -6 : 1-day;
  const monday = new Date(now);
  monday.setHours(0,0,0,0);
  monday.setDate(now.getDate()+diffToMonday);
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate()+6);
  sunday.setHours(23,59,59,999);
  return {start: monday.getTime(), end: sunday.getTime()};
}

function sessionsThisWeek(){
  const {start, end} = currentWeekRange();
  return (state.sessions || []).filter(s=>s.timestamp>=start && s.timestamp<=end).length;
}

function computeWeeklyVolume(){
  const {start, end} = currentWeekRange();
  const totals = {};
  Object.keys(MUSCLE_TARGETS).forEach(m=>totals[m]=0);
  (state.sessions || []).forEach(s=>{
    if(s.timestamp < start || s.timestamp > end) return;
    s.exercises.forEach(e=>{
      const muscle = e.muscleGroup || (e.id && MUSCLE_MAP[e.id]);
      if(!muscle || totals[muscle] === undefined) return;
      totals[muscle] = (totals[muscle]||0) + (e.sets ? e.sets.length : 0);
    });
  });
  return totals;
}

function renderCalendar(){
  const year = calendarCursor.getFullYear();
  const month = calendarCursor.getMonth();
  const first = new Date(year, month, 1);
  const startOffset = (first.getDay()+6)%7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const doneDates = new Set((state.sessions||[]).map(s=>s.date));
  const monthLabel = calendarCursor.toLocaleDateString(undefined, {month:'long', year:'numeric'});
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div class="cal-cell empty"></div>`;

    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const done = doneDates.has(dateStr);
    const selected = selectedCalendarDate === dateStr;
    cells += `<div class="cal-cell ${done?'done':''} ${selected?'selected':''}" data-action="select-date" data-date="${dateStr}">${d}${done?'<div class="cal-dot"></div>':''}</div>`;
  }
  return `
    <div class="card">

        ${cells}
      </div>
      ${selectedCalendarDate ? `<div class="link-btn muted" data-action="clear-date-filter">Clear filter (${selectedCalendarDate})</div>` : ''}
    </div>

function renderVolumeDashboard(){
  const totals = computeWeeklyVolume();
  const rows = Object.keys(MUSCLE_TARGETS).map(muscle=>{
    const count = totals[muscle] || 0;
    const target = MUSCLE_TARGETS[muscle];
    const pct = Math.min(100, Math.round((count/target)*100));
    const over = count > target;
    return `
      <div class="vol-row">
        <div class="vol-name">${muscle}</div>
        <div class="vol-bar-track"><div class="vol-bar-fill ${over?'over':''}" style="width:${pct}%;"></div></div>
        <div class="vol-count">${count}/${target}</div>
      </div>
    `;
  }).join('');
  return `<div class="card">${rows}</div>`;
}

const CUT_DEFICIT_PCT = {0.25:0.10, 0.5:0.15, 0.75:0.20, 1:0.25};
const BULK_SURPLUS_PCT = {0.25:0.05, 0.5:0.10, 0.75:0.15, 1:0.20};

function avgWorkoutsPerWeek(){
  const sessions = state.sessions || [];
  if(!sessions.length) return (state.workoutGoal && state.workoutGoal.perWeek) || 4;
  const weeks = new Set(sessions.map(s=>isoWeekKey(s.date)));
  return sessions.length / weeks.size;
}

function calculateTDEE(profile){
  if(!profile.weight || !profile.height || !profile.age) return null;
  const sexAdj = profile.sex === 'female' ? -161 : 5;
  const bmr = 10*profile.weight + 6.25*profile.height - 5*profile.age + sexAdj;
  const activityMultipliers = {desk:1.2, moderate:1.375, active:1.55};
  let tdee = bmr * (activityMultipliers[profile.activityLevel] || 1.2);
  const steps = profile.stepsPerDay || 0;
  tdee += Math.max(0, steps - 5000) / 1000 * 40;
  tdee += avgWorkoutsPerWeek() * 300 / 7;
  return Math.round(tdee);
}

function calorieTarget(tdee, goal, profile){
  if(tdee === null) return null;
  let base;
  if(goal.type === 'maintain'){
    base = tdee;
  } else if(goal.type === 'cut'){
    const pct = CUT_DEFICIT_PCT[goal.rateKgPerWeek] !== undefined ? CUT_DEFICIT_PCT[goal.rateKgPerWeek] : 0.15;
    base = tdee * (1 - pct);
  } else {
    const pct = BULK_SURPLUS_PCT[goal.rateKgPerWeek] !== undefined ? BULK_SURPLUS_PCT[goal.rateKgPerWeek] : 0.10;
    base = tdee * (1 + pct);
  }
  base = Math.round(base) + (goal.calorieAdjustment || 0);
  if(goal.type === 'cut'){
    const floor = (profile && profile.sex === 'female') ? 1200 : 1500;
    base = Math.max(base, floor);
  }
  return base;
}

function proteinTarget(profile){
  if(!profile.weight) return null;
  return Math.round(profile.weight * 2.2);
}

function isoWeekKey(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  const diffToMonday = (day===0) ? -6 : 1-day;
  const monday = new Date(d);
  monday.setDate(d.getDate()+diffToMonday);
  return monday.toISOString().slice(0,10);
}

function weeklyAverages(){
  const groups = {};
  (state.checkins || []).forEach(c=>{
    const key = isoWeekKey(c.date);
    if(!groups[key]) groups[key] = [];
    groups[key].push(c.weight);
  });
  return Object.keys(groups).sort().map(k=>({
    week:k,
    avg: groups[k].reduce((a,b)=>a+b,0) / groups[k].length
  }));
}

function checkFlatTrend(goal){
  if(!goal || goal.type === 'maintain') return false;
  const weeks = weeklyAverages();
  if(weeks.length < 3) return false;
  const last3 = weeks.slice(-3).map(w=>w.avg);
  const d1 = last3[1] - last3[0];
  const d2 = last3[2] - last3[1];
  const threshold = 0.1;
  return goal.type === 'bulk' ? (d1 < threshold && d2 < threshold) : (d1 > -threshold && d2 > -threshold);
}

function ordinal(n){
  const s = ['th','st','nd','rd'];
  const v = n % 100;
  return n + (s[(v-20)%10] || s[v] || s[0]);
}

function formatOrdinalDate(d){
  const day = ordinal(d.getDate());
  const month = d.toLocaleDateString(undefined, {month:'long'});
  return `${day} of ${month}`;
}

function goalProjectionText(p, g){
  const diff = g.targetWeight - p.weight;
  if(Math.abs(diff) < 0.01) return "You're already at your target weight.";
  const weeksNeeded = Math.abs(diff) / g.rateKgPerWeek;
  const targetDate = new Date();
  targetDate.setDate(targetDate.getDate() + Math.round(weeksNeeded*7));
  const dateStr = formatOrdinalDate(targetDate);
  return `At ${g.rateKgPerWeek} kg/week, that's about ${Math.round(weeksNeeded)} weeks \u2014 around ${dateStr}.`;
}

function findExerciseById(exId){
  for(const day of state.days){
    const ex = day.exercises.find(e=>e.id===exId);
    if(ex) return ex;
  }
  return null;
}

function getEffectiveExercise(ex){
  const override = sessionOverrides[ex.id];
  if(!override) return ex;
  const base = override.replacement ? {...override.replacement} : {...ex};
  const merged = {...base, _origSlotId: ex.id, _replaced: !!override.replacement};
  if(override.warmup !== undefined && override.warmup !== null) merged.warmup = override.warmup;
  if(override.rest !== undefined && override.rest !== null) merged.rest = override.rest;
  if(override.targetSets !== undefined && override.targetSets !== null) merged.targetSets = override.targetSets;
  if(override.dropSet !== undefined && override.dropSet !== null) merged.dropSet = override.dropSet;
  return merged;
}

function getOrderedDayExercises(day){
  if(sessionExerciseOrder){
    const byId = {};
    day.exercises.forEach(e=>{ byId[e.id] = e; });
    const reordered = sessionExerciseOrder.map(id=>byId[id]).filter(Boolean);
    if(reordered.length === day.exercises.length) return reordered;
  }
  return day.exercises;
}

function shortDate(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d)) return dateStr;
  return d.toLocaleDateString(undefined, {day:'numeric', month:'short'});
}

function filterByRange(entries, range){
  if(range === 'all' || !entries.length) return entries;
  const days = range === 'week' ? 7 : range === 'month' ? 30 : 90;
  const cutoff = new Date(entries[entries.length-1].date + 'T00:00:00');
  cutoff.setDate(cutoff.getDate() - days);
  const filtered = entries.filter(e=>new Date(e.date + 'T00:00:00') >= cutoff);
  return filtered.length >= 2 ? filtered : entries.slice(-2);
}

function renderAxisChart(entries, unitLabel){
  if(entries.length < 2){
    return `<div style="color:var(--text-muted);font-size:13px;">Log a couple more entries to see a trend.</div>`;
  }
  const values = entries.map(e=>e.value);
  const dates = entries.map(e=>e.date);
  const vw = 320, vh = 170;
  const padL = 40, padR = 10, padT = 10, padB = 26;
  const plotW = vw - padL - padR, plotH = vh - padT - padB;

  let min = Math.min(...values), max = Math.max(...values);
  if(min === max){ min -= 1; max += 1; }
  const range = max - min;
  min -= range * 0.08;
  max += range * 0.08;

  const yTicks = 4;
  const yGrid = [];
  for(let i=0;i<=yTicks;i++){
    const val = min + (max-min)*(i/yTicks);
    const y = padT + plotH - (i/yTicks)*plotH;
    yGrid.push(`
      <line x1="${padL}" y1="${round(y)}" x2="${vw-padR}" y2="${round(y)}" stroke="var(--border)" stroke-width="1"/>
      <text x="${padL-6}" y="${round(y)+3}" text-anchor="end" font-size="9" fill="var(--text-muted)">${round(val)}</text>
    `);
  }

  const step = plotW / (entries.length - 1);
  const pts = values.map((v,i)=>{
    const x = padL + i*step;
    const y = padT + plotH - ((v-min)/(max-min))*plotH;
    return `${round(x)},${round(y)}`;
  });
  const dots = values.map((v,i)=>{
    const x = padL + i*step;
    const y = padT + plotH - ((v-min)/(max-min))*plotH;
    return `<circle cx="${round(x)}" cy="${round(y)}" r="2.5" fill="#6FA05C"/>`;
  }).join('');

  const xLabelCount = Math.min(4, entries.length);
  const xLabels = [];
  for(let i=0;i<xLabelCount;i++){
    const idx = xLabelCount === 1 ? 0 : Math.round(i * (entries.length-1) / (xLabelCount-1));
    const x = padL + idx*step;
    xLabels.push(`<text x="${round(x)}" y="${vh-6}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${shortDate(dates[idx])}</text>`);
  }

  return `
    <svg viewBox="0 0 ${vw} ${vh}" style="width:100%;height:auto;display:block;">
      ${yGrid.join('')}
      <polyline points="${pts.join(' ')}" fill="none" stroke="#6FA05C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
      ${xLabels.join('')}
    </svg>
  `;
}

function renderWeightChart(){

    </div>
  `;
}

function renderWeightHistoryRows(){
  const checkins = (state.checkins||[]).slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!checkins.length) return `<div class="hist-row"><span>Nothing logged yet.</span></div>`;
  return checkins.map(c=>`
    <div class="hist-row">
      <span>${c.date}</span>
      <span style="display:flex;align-items:center;gap:6px;">
        <b>${c.weight} ${state.unit}</b>
        <button class="hist-del" data-action="delete-checkin" data-date="${c.date}" title="Delete">\u2715</button>
      </span>
    </div>
  `).join('');
}

function renderMeasurementChart(metric){
  const list = (state.measurements||[]).filter(m=>m[metric]!=null).slice().sort((a,b)=>new Date(a.date)-new Date(b.date));
  if(!list.length){
    return `<div style="color:var(--text-muted);font-size:13px;">No entries for this measurement yet.</div>`;
  }
  const entries = filterByRange(list.map(m=>({date:m.date, value:m[metric]})), bodyChartRange);
  const values = entries.map(e=>e.value);
  const change = values[values.length-1] - values[0];
  return `
    ${chartRangeToggle()}
    <div style="margin-bottom:10px;">${renderAxisChart(entries, 'cm')}</div>
    <div style="font-size:12px;color:var(--text-muted);">
      ${entries[0].date} \u2192 ${entries[entries.length-1].date} \u00b7 ${change>=0?'+':''}${round(change)} cm
    </div>
  `;
}

function renderMeasurementHistoryRows(){
  const list = (state.measurements||[]).map((m,i)=>({...m, _idx:i})).sort((a,b)=>new Date(b.date)-new Date(a.date));
  if(!list.length) return `<div class="hist-row"><span>Nothing logged yet.</span></div>`;
  return list.map(m=>{
    const parts = [
      m.waist?`waist ${m.waist}cm`:null,
      m.chest?`chest ${m.chest}cm`:null,
      m.arms?`arms ${m.arms}cm`:null,
      m.thighs?`thighs ${m.thighs}cm`:null
    ].filter(Boolean).join(', ');
    return `
      <div class="hist-row">
        <span>${m.date}</span>
        <span style="display:flex;align-items:center;gap:6px;">
          <b>${parts}</b>
          <button class="hist-del" data-action="delete-measurement" data-idx="${m._idx}" title="Delete">\u2715</button>
        </span>
      </div>
    `;
  }).join('');
}

function renderFeaturedPopup(){
  if(!featuredPopup || !featuredPopup.length) return '';
  const anyGoal = featuredPopup.some(e=>e.isGoal);
  const headline = anyGoal
    ? "You've hit your goal! Looks like the hard work is paying off."
    : "You've smashed your PB! Looks like the hard work is paying off.";
  const rows = featuredPopup.map(e=>{
    const tag = e.isGoal ? 'Goal hit!' : 'New PB!';
    return `<div class="hist-row"><span>${e.name}</span><b>${e.weight}${state.unit} \u00d7 ${e.reps} \u00b7 ${tag}</b></div>`;
  }).join('');
  return `
    <div class="overlay-backdrop" data-action="close-featured-popup"></div>
    <div class="overlay-panel">
      <div class="overlay-head">
        <div class="overlay-title">\ud83c\udfc6 Nice work!</div>
        <button class="overlay-close" data-action="close-featured-popup">\u2715</button>
      </div>
      <div style="font-size:13px;color:var(--text-muted);margin-bottom:10px;">${headline}</div>
      <div class="hist-list" style="margin-top:0;">${rows}</div>
    </div>
  `;
}

function renderGoalPopup(){
  if(!goalPopup) return '';
  return `
    <div class="overlay-backdrop" data-action="close-goal-popup"></div>
    <div class="overlay-panel">
      <div class="overlay-head">
        <div class="overlay-title">\ud83c\udf89 Target hit!</div>
        <button class="overlay-close" data-action="close-goal-popup">\u2715</button>
      </div>
      <div style="font-size:13px;color:var(--text-muted);">Congrats! You've hit your ${goalPopup}-workout target this week. Keep it up!</div>
    </div>
  `;
}

function renderBodyOverlay(){
  if(!bodyOverlayOpen) return '';
  if(bodyOverlayOpen === 'weight'){
    return `
      <div class="overlay-backdrop" data-action="close-body-overlay"></div>
      <div class="overlay-panel">
        <div class="overlay-head">
          <div class="overlay-title">Weight history</div>
          <button class="overlay-close" data-action="close-body-overlay">\u2715</button>
        </div>
        <div class="overlay-chart">${renderWeightChart()}</div>
        <div class="hist-list">${renderWeightHistoryRows()}</div>
      </div>
    `;
  }
  const metrics = [['waist','Waist'],['chest','Chest'],['arms','Arms'],['thighs','Thighs']];
  return `
    <div class="overlay-backdrop" data-action="close-body-overlay"></div>
    <div class="overlay-panel">
      <div class="overlay-head">
        <div class="overlay-title">Measurement history</div>
        <button class="overlay-close" data-action="close-body-overlay">\u2715</button>
      </div>
      <div class="metric-toggle">

      </div>
      <div class="overlay-chart">${renderMeasurementChart(bodyOverlayMetric)}</div>
      <div class="hist-list">${renderMeasurementHistoryRows()}</div>

function sparkline(values, w, h){
  if(values.length < 2) return '';
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const step = w / (values.length - 1);
  const pts = values.map((v,i)=>`${round(i*step)},${round(h - ((v-min)/range)*h)}`).join(' ');
  return `<svg width="${w}" height="${h}" class="sparkline"><polyline points="${pts}" fill="none" stroke="#6FA05C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function formatDuration(seconds){
  if(seconds === null || seconds === undefined) return '';
  const mins = Math.round(seconds/60);
  if(mins < 1) return '<1 min';
  return `${mins} min`;
}

function getSessionEditList(s){
  const day = state.days.find(d=>d.id===s.dayId);
  const combined = [];
  const seen = new Set();
  if(day){
    day.exercises.forEach(ex=>{
      const logged = s.exercises.find(e=>e.id===ex.id);
      combined.push(logged
        ? JSON.parse(JSON.stringify(logged))
        : {id:ex.id, name:ex.name, muscleGroup:ex.muscleGroup, cardio:!!ex.cardio, warmup:[], sets:[], dropset:null});
      seen.add(ex.id);
    });
  }
  s.exercises.forEach(e=>{
    if(!seen.has(e.id)) combined.push(JSON.parse(JSON.stringify(e)));
  });
  return combined;
}

      html += `</div><div class="link-btn" data-action="edit-add-set" data-ex="${exIdx}">+ Add set</div>`;
      html += `<div class="set-label">Drop set</div><div id="edit-drop-${exIdx}">`;
      if(ex.dropset) html += sessionEditSetRow(exIdx, 0, ex.dropset, 'drop');
      html += `</div>`;
      if(!ex.dropset) html += `<div class="link-btn" data-action="edit-add-drop" data-ex="${exIdx}">+ Add drop set</div>`;
    }
    html += `</div>`;
  });
  html += `
    <div class="actions" style="margin-top:6px;margin-bottom:30px;">
      <button class="cancel" data-action="cancel-session-edit">Cancel</button>
      <button class="save" data-action="save-session-edit">Save changes</button>
    </div>
  `;
  return html;
}

function sessionEditSetRow(exIdx, setIdx, st, kind){
  if(kind === 'cardio'){
    return `
      <div class="set-row" data-ex="${exIdx}" data-set="${setIdx}">
        <div class="set-num">${setIdx+1}</div>
        <input type="number" inputmode="decimal" class="w-input" value="${st.duration}" style="flex:1;">
        <div class="x">min</div>
        <button class="rm" data-action="edit-rm-set" data-ex="${exIdx}" data-set="${setIdx}">\u274c</button>
      </div>
    `;
  }
  const numLabel = kind==='drop' ? 'D' : kind==='warmup' ? `W${setIdx+1}` : `${setIdx+1}`;
  const removeAction = kind==='drop' ? 'edit-rm-drop' : kind==='warmup' ? 'edit-rm-warmup' : 'edit-rm-set';
  return `
    <div class="set-row" data-ex="${exIdx}" data-set="${setIdx}">
      <div class="set-num">${numLabel}</div>
      <input type="number" inputmode="decimal" class="w-input" value="${st.weight}">
      <div class="x">\u00d7</div>
      <input type="number" inputmode="numeric" class="r-input" value="${st.reps}">
      <button class="rm" data-action="${removeAction}" data-ex="${exIdx}" data-set="${setIdx}">\u274c</button>
    </div>
  `;
}

function saveSessionEdit(){
  const idx = (state.sessions||[]).findIndex(s=>s.timestamp===editingSessionTs);
  if(idx === -1){ screen='history'; render(); return; }
  const s = state.sessions[idx];
  const list = getSessionEditList(s);
  const rebuilt = [];
  document.querySelectorAll('.card[data-ex-idx]').forEach(card=>{
    const exIdx = parseInt(card.dataset.exIdx);
    const orig = list[exIdx];
    if(!orig) return;

    if(orig.cardio){
      const setsContainer = document.getElementById(`edit-sets-${exIdx}`);
      const sets = [];
      if(setsContainer){
        setsContainer.querySelectorAll('.set-row').forEach(row=>{
          const d = parseFloat(row.querySelector('.w-input').value);
          if(!isNaN(d) && d>0) sets.push({duration:d});
        });
      }
      rebuilt.push({id:orig.id, name:orig.name, muscleGroup:orig.muscleGroup, cardio:true, warmup:[], sets, dropset:null});
      return;
    }

    const warmupContainer = document.getElementById(`edit-warmup-${exIdx}`);
    const warmup = [];
    if(warmupContainer){
      warmupContainer.querySelectorAll('.set-row').forEach(row=>{
        const w = parseFloat(row.querySelector('.w-input').value);
        const r = parseInt(row.querySelector('.r-input').value);
        if(!isNaN(w) && !isNaN(r) && w>0 && r>0) warmup.push({weight:w, reps:r});
      });
    }
    const setsContainer = document.getElementById(`edit-sets-${exIdx}`);
    const sets = [];
    if(setsContainer){
      setsContainer.querySelectorAll('.set-row').forEach(row=>{
        const w = parseFloat(row.querySelector('.w-input').value);
        const r = parseInt(row.querySelector('.r-input').value);
        if(!isNaN(w) && !isNaN(r) && w>0 && r>0) sets.push({weight:w, reps:r});
      });
    }
    const dropContainer = document.getElementById(`edit-drop-${exIdx}`);
    let dropset = null;
    if(dropContainer){
      const row = dropContainer.querySelector('.set-row');
      if(row){
        const w = parseFloat(row.querySelector('.w-input').value);
        const r = parseInt(row.querySelector('.r-input').value);
        if(!isNaN(w) && !isNaN(r) && w>0 && r>0) dropset = {weight:w, reps:r};
      }
    }
    rebuilt.push({id:orig.id, name:orig.name, muscleGroup:orig.muscleGroup, cardio:false, warmup, sets, dropset});
  });

  const finalExercises = rebuilt.filter(ex=>ex.sets.length);
  if(!finalExercises.length){
    showToast('Keep at least one set logged');
    return;
  }

  finalExercises.forEach(ex=>{
    if(!ex.cardio){
      const topWeight = Math.max(...ex.sets.map(st=>st.weight));
      const logArr = state.logs[ex.id] || [];
      const others = logArr.filter(l=>l.sessionId !== editingSessionTs);
      const prevBest = others.length ? Math.max(...others.map(l=>Math.max(...l.sets.map(st=>st.weight)))) : null;
      ex.pr = prevBest !== null && topWeight > prevBest;
    } else {
      ex.pr = false;
    }
    const logArr = state.logs[ex.id] || [];
    const logIdx = logArr.findIndex(l=>l.sessionId===editingSessionTs);
    const logEntry = {date: s.date, warmup: ex.warmup, sets: ex.sets, dropset: ex.dropset, pr: ex.pr, sessionId: editingSessionTs};
    if(logIdx !== -1){
      logArr[logIdx] = {...logArr[logIdx], ...logEntry};
    } else {
      logArr.push(logEntry);
    }
    state.logs[ex.id] = logArr;
  });

  const finalIds = new Set(finalExercises.map(e=>e.id));
  s.exercises.forEach(e=>{
    if(!finalIds.has(e.id)){
      state.logs[e.id] = (state.logs[e.id]||[]).filter(l=>l.sessionId !== editingSessionTs);
    }
  });

  s.exercises = finalExercises;
  saveData();
  editingSessionTs = null;
  screen = 'history';
  render();
  showToast('Workout updated');
}

function buildExerciseNameLookup(){
  const lookup = {};
  (state.sessions||[]).forEach(s=>{
    s.exercises.forEach(e=>{ lookup[e.id] = e.name; });
  });
  state.days.forEach(day=>{
    day.exercises.forEach(ex=>{ if(!lookup[ex.id]) lookup[ex.id] = ex.name; });
  });
  return lookup;
}

function computeAllPRs(){
  const nameLookup = buildExerciseNameLookup();
  const results = [];
  Object.keys(state.logs).forEach(exId=>{
    const log = state.logs[exId];
    if(!log || !log.length) return;
    let best = null;
    log.forEach(l=>{
      l.sets.forEach(s=>{
        if(s.weight === undefined) return;
        if(!best || s.weight > best.weight || (s.weight === best.weight && new Date(l.date) > new Date(best.date))){
          best = {weight: s.weight, reps: s.reps, date: l.date};
        }
      });
    });
    if(best){
      results.push({exId, name: nameLookup[exId] || 'Unknown exercise', ...best});
    }
  });
  results.sort((a,b)=> new Date(b.date) - new Date(a.date));
  return results;
}

  if(!prs.length){

  prs.forEach(pr=>{

function attachHandlers(){
  document.querySelectorAll('[data-action="pick-brand"]').forEach(el=>{
    el.onclick = ()=>{
      const brandId = el.dataset.brand;
      if(brandId === 'smartgainz'){
        completeLogin(brandId);
        return;
      }
      pendingBrand = brandId;
      loginError = '';
      screen = 'login';
      render();
    };
  });
  const backToBrandBtn = document.querySelector('[data-action="back-to-brand-select"]');
  if(backToBrandBtn) backToBrandBtn.onclick = ()=>{
    pendingBrand = null;
    loginError = '';
    screen = 'brand-select';
    render();
  };
  const submitLoginBtn = document.querySelector('[data-action="submit-login"]');

function attachSetRowInputListeners(row){
  const w = row.querySelector('.w-input');
  const r = row.querySelector('.r-input');
  if(!w || !r) return;
  w.addEventListener('input', scheduleDraftSave);
  r.addEventListener('input', scheduleDraftSave);
  const tryAutoStart = ()=>{
    if(row.dataset.timerStarted) return;
    const wv = parseFloat(w.value);
    const rv = parseInt(r.value);
    if(!isNaN(wv) && wv>0 && !isNaN(rv) && rv>0){
      row.dataset.timerStarted = '1';
      const isWarmup = row.classList.contains('warmup-row');
      const card = row.closest('.exercise-card');
      const origExId = card ? card.dataset.origEx : null;
      const day = state.days.find(d=>d.id===activeDay);
      const orig = day && origExId ? day.exercises.find(e=>e.id===origExId) : null;
      const effective = orig ? getEffectiveExercise(orig) : null;
      const name = effective ? effective.name : '';
      const duration = isWarmup ? 60 : (effective ? (effective.rest || 90) : 90);
      startTimer(duration, name);
    }
  };
  w.addEventListener('change', tryAutoStart);
  r.addEventListener('change', tryAutoStart);
}

function copySet(exId, idx){
  const rows = document.querySelectorAll(`#sets-${exId} .set-row`);

  scheduleDraftSave();

function exitReorderMode(){
  reorderMode = false;
  document.body.classList.remove('reorder-active');
  saveData();
  render();

function attachReorderHandlers(){
  const list = document.getElementById('exercise-list');
  if(!list) return;
  const doneBar = document.getElementById('reorder-done-bar');
  if(doneBar) doneBar.onclick = exitReorderMode;

  if(reorderMode) document.body.classList.add('reorder-active');
  if(!reorderMode) return;

  const cards = Array.from(list.querySelectorAll('.exercise-card'));
  cards.forEach(card=>{
    const handle = card.querySelector('.drag-handle');
    if(!handle) return;

    handle.addEventListener('pointerdown', (e)=>{
      e.preventDefault();
      const rect = card.getBoundingClientRect();
      const pointerOffsetY = e.clientY - rect.top;
      const cardHeight = rect.height;

      const placeholder = document.createElement('div');
      placeholder.className = 'drag-placeholder';
      placeholder.style.height = cardHeight + 'px';
      list.insertBefore(placeholder, card);

      card.style.position = 'fixed';
      card.style.top = rect.top + 'px';
      card.style.left = rect.left + 'px';
      card.style.width = rect.width + 'px';
      card.classList.add('dragging');
      document.body.appendChild(card);

      function onMove(ev){
        const y = ev.clientY;
        card.style.top = (y - pointerOffsetY) + 'px';
        const cardMid = y - pointerOffsetY + cardHeight/2;
        const siblings = Array.from(list.children).filter(el=>el !== placeholder);
        let target = null;
        for(const sib of siblings){
          const sRect = sib.getBoundingClientRect();
          if(cardMid < sRect.top + sRect.height/2){ target = sib; break; }
        }
        if(target){
          if(placeholder.nextSibling !== target) list.insertBefore(placeholder, target);
        } else if(list.lastChild !== placeholder){
          list.appendChild(placeholder);
        }
      }

      function onEnd(){
        document.removeEventListener('pointermove', onMove);
        document.removeEventListener('pointerup', onEnd);
        card.classList.remove('dragging');
        card.style.position = '';
        card.style.top = '';
        card.style.left = '';
        card.style.width = '';
        list.insertBefore(card, placeholder);
        placeholder.remove();

        const orderedIds = Array.from(list.querySelectorAll('.exercise-card')).map(c=>c.dataset.origEx);
        const day = state.days.find(d=>d.id===activeDay);
        if(day && orderedIds.length === day.exercises.length){
          if(screen === 'day'){
            sessionExerciseOrder = orderedIds;
          } else {
            const byId = {};
            day.exercises.forEach(ex=>{ byId[ex.id] = ex; });
            const reordered = orderedIds.map(id=>byId[id]).filter(Boolean);
            if(reordered.length === day.exercises.length){
              day.exercises = reordered;
              saveData();
            }
          }
        }
        render();
      }

      document.addEventListener('pointermove', onMove);
      document.addEventListener('pointerup', onEnd);
    });
  });
}


function deleteSession(ts){
  const idx = (state.sessions || []).findIndex(s=>s.timestamp === ts);
  if(idx === -1) return;
  activeModal = {
    type:'confirm-action',
    title:'Delete this workout?',
    message:"Delete this workout from history? This also removes it from each exercise's progression history and can't be undone.",
    confirmLabel:'Delete',
    onConfirm: ()=>{
      state.sessions.splice(idx, 1);
      Object.keys(state.logs).forEach(exId=>{
        state.logs[exId] = state.logs[exId].filter(l=>l.sessionId !== ts);
      });
      delete openSessions[ts];
      saveData();
      render();
    }
  };
  render();
}
